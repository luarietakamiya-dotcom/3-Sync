<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0c15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>3-Sync ノイズダイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: phone-first single column — status header, tabs, then the town/dive canvas with its context panel below.
   Single dark neon look on purpose: the game lives in a night-time cyber city. */
:root{
  --bg:#0e0c15; --panel:#181524; --panel2:#211d31; --ink:#ece8f4; --muted:#9a93ad; --line:#2e2942; --dim:#5d5772;
  --gold:#f6c445; --pink:#ff4fa8; --cyan:#3fe0ff; --ok:#7be0a0; --danger:#ff6b6b;
  --r-c:#a8a4b8; --r-r:#6aa8e8; --r-e:#c58bf0; --r-l:#f2c14b;
  --f-display:"DotGothic16","Hiragino Sans",monospace;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-block:10px 40px;display:flex;flex-direction:column;gap:12px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;display:flex;flex-direction:column;gap:8px}
.hud{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.money{font-family:var(--f-display);font-size:1.6rem;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.money small{font-family:var(--f-body);font-size:.72rem;color:var(--muted);margin-left:6px}
.lv{text-align:right;font-size:.8rem;color:var(--muted);min-width:0}
.lv b{font-family:var(--f-display);font-weight:400;color:var(--ink);font-size:1rem}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px;width:120px;margin-left:auto}
.bar i{display:block;height:100%;background:var(--pink);width:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{font:inherit;font-size:.82rem;font-weight:700;border:0;background:none;color:var(--muted);padding:8px 2px;border-radius:9px;cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--cyan)}
.tabs .dot{position:absolute;top:5px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--pink)}
h2{font-size:.76rem;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:700}
h3{font-family:var(--f-display);font-weight:400;font-size:1.05rem;margin:0}
.note{font-size:.78rem;color:var(--muted);margin:0;line-height:1.55}
.btn{font:inherit;font-size:.85rem;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.btn:disabled{color:var(--dim);cursor:default}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn.primary{background:var(--pink);color:#1a0a14;border-color:var(--pink);font-weight:700}
.btn.primary:disabled{background:var(--panel2);color:var(--dim);border-color:var(--line)}
.btn.danger{color:var(--danger)}
.btn.sm{font-size:.76rem;padding:6px 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}

/* main view */
.locbar{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.locbar b{color:var(--ink);font-family:var(--f-display);font-weight:400}
.cv{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#07060c}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%;touch-action:none;position:relative;z-index:1}
/* background layer: exterior / interiors, pixel art scaled with nearest-neighbour */
.cv img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:crisp-edges;image-rendering:pixelated;z-index:0;pointer-events:none}
/* facility interior shown as an image window over the town */
.vig{position:absolute;left:50%;top:3%;width:88%;aspect-ratio:16/5;transform:translateX(-50%);z-index:2;pointer-events:none;
  border:2px solid var(--pink);border-radius:6px;overflow:hidden;background:#07060c;box-shadow:0 0 0 3px rgba(14,12,21,.85),0 0 24px rgba(255,79,168,.55);animation:vigin .28s ease-out}
.vig[hidden]{display:none}
.vig img{display:block;width:100%;height:100%;object-fit:cover;image-rendering:crisp-edges;image-rendering:pixelated}
.vlabel{position:absolute;left:6px;top:6px;font-family:var(--f-display);font-size:.72rem;padding:2px 8px;border-radius:4px;background:rgba(14,12,21,.8);color:var(--ink);border:1px solid rgba(255,79,168,.6)}
@keyframes vigin{from{opacity:0;transform:translateX(-50%) scale(.92)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.vig{animation:none}}
.overlay{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,8,16,.78);text-align:center;padding:16px}
.overlay[hidden]{display:none}
.overlay .big{font-family:var(--f-display);font-size:1.5rem}
.divebar{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.divebar .note{white-space:nowrap}
.sync{height:10px;border-radius:5px;background:var(--line);overflow:hidden;position:relative}
.sync i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--gold),var(--pink),var(--cyan))}
.syncbtn{font-family:var(--f-display);letter-spacing:.06em}
.syncbtn.ready{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,79,168,.35)}}
.bag{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.bag b{color:var(--ink);font-variant-numeric:tabular-nums}
.mis{display:flex;flex-direction:column;gap:6px}
.mi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.mi .cl{font-size:.7rem;color:var(--muted)}
.mi .tx{font-weight:700;font-size:.88rem;min-width:0}
.mi .sub{font-size:.72rem;color:var(--muted);grid-column:1}
.mi .rw{font-size:.8rem;color:var(--gold);font-variant-numeric:tabular-nums;text-align:right}
.mi .rw.free{color:var(--ok)}
.mi .act{grid-column:2;grid-row:2 / span 2;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.mi.done{border-color:var(--ok)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;grid-column:1}
.prog i{display:block;height:100%;background:var(--ok)}
.tag{display:inline-block;font-size:.66rem;padding:1px 6px;border-radius:6px;border:1px solid currentColor;margin-left:6px;vertical-align:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:.72rem;color:var(--muted)}
.stats b{display:block;color:var(--ink);font-size:.95rem;font-variant-numeric:tabular-nums}
.log{font-size:.78rem;display:flex;flex-direction:column;gap:2px;min-height:3.4em;color:var(--muted)}
.facgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.list{display:flex;flex-direction:column;gap:6px}
.item{box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.item:disabled{cursor:default}
.item:disabled .cost{color:var(--dim)}
.item .name{font-weight:700;min-width:0}
.item .own{font-family:var(--f-display);font-size:1.15rem;color:var(--pink);grid-row:span 2;font-variant-numeric:tabular-nums}
.item .desc{font-size:.74rem;color:var(--muted);min-width:0}
.cost{font-size:.82rem;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.matsell{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 2px;border-bottom:1px solid var(--line)}
.matrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:.84rem;padding:6px 2px;border-bottom:1px solid var(--line)}
.matrow span:last-child{color:var(--gold);font-variant-numeric:tabular-nums;text-align:right;min-width:5em}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chars button{font:inherit;font-size:.78rem;font-weight:700;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.chars button[aria-pressed="true"]{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.chars button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.chars .face{width:32px;height:64px;background-repeat:no-repeat;background-size:1200% 100%;background-position:9.0909% 0}
.chars small{font-weight:400;color:var(--muted);font-size:.68rem}
.viewsw{display:flex;gap:6px;margin-bottom:10px}
.viewsw button{font:inherit;font-size:.78rem;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.viewsw button[aria-pressed="true"]{color:var(--ink);border-color:var(--pink)}

/* skills */
.sktop{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap}
.spbig{font-family:var(--f-display);font-weight:400;font-size:1.4rem;color:var(--pink)}
#skq{font:inherit;font-size:.84rem;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:0;flex:1 1 160px;max-width:240px;-webkit-user-select:text;user-select:text}
.treewrap{position:relative;height:min(62vh,460px);border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#06050b;margin-bottom:10px}
#tree{width:100%;height:100%;aspect-ratio:auto;touch-action:none;cursor:grab}
.treebtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.legend{position:absolute;left:8px;bottom:6px;right:8px;font-size:.66rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;pointer-events:none}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 12px;font-size:.8rem}
.statgrid b{font-variant-numeric:tabular-nums}
.bslot{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center}
.bslot input{font:inherit;font-size:.84rem;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);min-width:0;-webkit-user-select:text;user-select:text}
#builds{margin-bottom:10px}

.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.branch{display:flex;flex-direction:column;gap:8px;min-width:0}
.branch h3{text-align:center;font-size:.9rem}
.branch .who{font-size:.66rem;color:var(--muted);text-align:center;margin-top:-6px}
.node{font:inherit;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:2px;position:relative}
.node+.node::before{content:"";position:absolute;left:50%;top:-9px;width:2px;height:8px;background:var(--line)}
.node .nm{font-weight:700;font-size:.8rem}
.node .ds{font-size:.68rem;color:var(--muted)}
.node .lvl{font-size:.7rem;color:var(--ok);font-variant-numeric:tabular-nums}
.node.locked{opacity:.45}
.node.max{border-color:var(--ok)}
.node.can{border-color:var(--pink)}

/* gear */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;font-size:.74rem;min-width:0;cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.slot .k{color:var(--muted)}
.slot .v{font-weight:700;font-size:.78rem;overflow-wrap:anywhere}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.gi{font:inherit;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--rc);border-radius:10px;padding:7px 9px;cursor:pointer;color:inherit;min-width:0}
.gi .t{font-weight:700;font-size:.78rem;color:var(--rc);overflow-wrap:anywhere}
.gi .s{font-size:.68rem;color:var(--muted)}
.gi.sel{outline:2px solid var(--ink)}
.gi.eq{background:var(--panel2)}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.detail .t{font-weight:700;color:var(--rc)}
.rc-c{--rc:var(--r-c)}.rc-r{--rc:var(--r-r)}.rc-e{--rc:var(--r-e)}.rc-l{--rc:var(--r-l)}

textarea{width:100%;box-sizing:border-box;min-height:80px;font-family:ui-monospace,monospace;font-size:.72rem;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);word-break:break-all}
.box{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;max-width:85vw;text-align:center;z-index:20}
.toast.show{opacity:1}
.mainlay,.sidecol{display:flex;flex-direction:column;gap:10px}
.stagecol{display:flex;flex-direction:column;gap:6px;min-width:0}
/* landscape phones and PCs: stage on the left sized to the viewport height, menus beside it */
@media (min-aspect-ratio:4/3) and (min-width:640px){
  .wrap{max-width:1500px;padding-block:6px 16px;gap:8px}
  .top{flex-direction:row;align-items:center;gap:12px;padding-block:4px}
  .top .hud{flex:0 0 auto;gap:16px}
  .top .tabs{flex:1 1 auto;max-width:520px;margin-left:auto}
  .mainlay{display:grid;grid-template-columns:minmax(0,var(--stw)) minmax(250px,1fr);gap:12px;align-items:start;
    --stw:min(calc(100vw - 330px),calc((100vh - 112px) * 16 / 9))}
  @supports (height:100dvh){.mainlay{--stw:min(calc(100vw - 330px),calc((100dvh - 112px) * 16 / 9))}}
  .sidecol{max-height:calc(100vh - 80px);overflow-y:auto;position:sticky;top:60px;padding-right:2px}
  @supports (height:100dvh){.sidecol{max-height:calc(100dvh - 80px)}}
  .btn{min-height:40px}.btn.sm{min-height:36px}
  .facgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
@media (max-width:420px){.tree{gap:6px}.node{padding:6px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.syncbtn.ready{animation:none}}
</style>
</head>
<body>


<div class="wrap">
  <div class="top">
    <div class="hud">
      <div class="money">¥<span id="num">0</span><small id="rateTop"></small></div>
      <div class="lv"><span id="cname">ルアリエ</span> <b id="lv">Lv1</b> ・ SP <b id="sp">0</b><div class="bar"><i id="xpbar"></i></div></div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-t="main" aria-selected="true">街・探索</button>
      <button role="tab" data-t="skill" aria-selected="false">スキル<span class="dot" id="spdot" hidden></span></button>
      <button role="tab" data-t="gear" aria-selected="false">そうび</button>
      <button role="tab" data-t="save" aria-selected="false">セーブ</button>
    </div>
  </div>

  <section id="p-main" class="mainlay">
    <div class="stagecol">
    <div class="locbar"><span id="loc">新御霊市・下層</span><span id="locR"></span></div>
    <div class="cv">
      <img id="bgimg" class="bg" alt="" hidden draggable="false"><canvas id="cv" width="1280" height="720" aria-label="ゲーム画面"></canvas>
      <div class="vig" id="vig" hidden><img id="vigimg" alt="" draggable="false"><span class="vlabel" id="viglabel"></span></div>
      <div class="overlay" id="ov" hidden><div class="big" id="ovt"></div><div class="note" id="ovs"></div><div class="row" id="ovb" style="justify-content:center"></div></div>
    </div>
    </div>
    <div class="sidecol">
    <div id="townUI" class="card"><div id="fac"></div></div>
    <div id="diveUI" class="card" hidden>
      <div class="divebar">
        <div><div class="note" style="margin-bottom:4px">同期ゲージ</div><div class="sync"><i id="syncbar"></i></div></div>
        <button class="btn syncbtn" id="bSync" disabled>3-Sync</button>
        <button class="btn" id="bYog">ヨーグルト ×<span id="yogn">0</span></button>
      </div>
      <div class="bag" id="bag"></div>
      <div class="mis" id="dmis"></div>
      <div class="log" id="log"></div>
    </div>
    <div class="stats">
      <div>攻撃<b id="stAtk">0</b></div><div>HP<b id="stHp">0</b></div><div>会心<b id="stCrit">0%</b></div>
    </div>
    <p class="note" id="help"></p>
    </div>
  </section>

  <section id="p-skill" hidden>
    <div class="viewsw" id="vsw1"></div>
    <div class="sktop"><div><b id="spFree" class="spbig">0</b> SP 残り <span class="note" id="spInfo"></span></div>
      <input id="skq" type="search" placeholder="スキル名・効果で検索" autocomplete="off" aria-label="スキル検索"></div>
    <div class="treewrap"><canvas id="tree" aria-label="スキルツリー"></canvas>
      <div class="treebtns"><button class="btn sm" id="tvIn" aria-label="拡大">＋</button><button class="btn sm" id="tvOut" aria-label="縮小">－</button><button class="btn sm" id="tvFit">全体</button><button class="btn sm" id="tvHome">中心</button></div>
      <div class="legend"><span>●取得済み</span><span>◌点滅＝取得できる</span><span>◇特殊ノード</span><span>◎キーストーン</span></div></div>
    <div class="detail" id="skdet"></div>
    <div class="card" id="builds"></div>
    <div class="card"><h2 style="margin:0">いまの能力</h2><div class="statgrid" id="statsum"></div></div>
  </section>

  <section id="p-gear" hidden>
    <div class="viewsw" id="vsw2"></div>
    <h2>装備中</h2>
    <div class="slots" id="slots"></div>
    <div class="detail" id="detail" hidden style="margin-top:10px"></div>
    <div class="row" style="justify-content:space-between;margin:14px 0 8px"><h2 style="margin:0">もちもの <span id="invc"></span></h2></div>
    <div class="inv" id="inv"></div>
    <h2 style="margin-top:14px">素材（倉庫）</h2><div class="bag" id="matlist"></div>
  </section>

  <section id="p-save" hidden>
    <div class="row">
      <button class="btn" id="bSave">今すぐ保存</button>
      <button class="btn" id="bExport">引き継ぎコードを出す</button>
      <button class="btn" id="bImport">コードで復元</button>
      <button class="btn danger" id="bReset">はじめから</button>
    </div>
    <div class="box" id="exportBox" hidden><textarea id="exportText" readonly aria-label="引き継ぎコード"></textarea><button class="btn" id="bCopy">コピー</button><p class="note">別の端末で「コードで復元」に貼ると続きから遊べます。</p></div>
    <div class="box" id="importBox" hidden><textarea id="importText" aria-label="引き継ぎコードを貼り付け" placeholder="ここにコードを貼り付け"></textarea><button class="btn" id="bDoImport">復元する</button></div>
    <div class="box" id="resetBox" hidden><p class="note">データを全部消してはじめからにします。元に戻せません。</p><div class="row"><button class="btn danger" id="bDoReset">消してはじめる</button><button class="btn" id="bCancelReset">やめる</button></div></div>
    <p class="note" style="margin-top:12px" id="saved">未保存</p>
    <p class="note">10秒ごと・画面を閉じたときに自動保存。閉じている間もライブのお礼が貯まります（最大12時間）。</p>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>

const LAYOUT={
  luarie:{order:["crit","mob","fire","range","ctrl","def"],gap:{crit:0,mob:0,fire:1,range:1,ctrl:3,def:3}},

const FLATK=new Set(["extra","pierce","multiT","homing","luck"]);
function buildTree(cid){
  const L=LAYOUT[cid],U=UNIQUE[cid],nodes={},adj={},STEP=50,SIDE=30;
  const add=(id,o)=>{nodes[id]={id,cid,...o};adj[id]=adj[id]||new Set();return id;};
  const link=(a,b)=>{adj[a].add(b);adj[b].add(a);};
  const root=add(cid+":root",{nm:"起点",br:null,x:0,y:0,kind:"root",cost:0,max:1,eff:{}});
  const trunkAt={};
  L.order.forEach((br,bi)=>{
    const B=BRANCH[br],gap=L.gap[br],aff=gap===0?1.25:gap===1?1.0:0.85,ang=bi*Math.PI/3-Math.PI/2;
    const ux=Math.cos(ang),uy=Math.sin(ang),px=-uy,py=ux;
    const P=(r,side)=>[ux*r*STEP+px*side*SIDE,uy*r*STEP+py*side*SIDE];
    const scale=eff=>{const e={};for(const k in eff){const v=eff[k];e[k]=typeof v==="number"?+(v*(FLATK.has(k)?1:aff)).toFixed(2):v;}return e;};
    const sm=i=>{const [k,v]=B.s[i%2];return scale({[k]:v});};
    let prev=root;
    for(let g=0;g<gap;g++){const [x,y]=P(1+g,0);const id=add(`${cid}:${br}:g${g}`,{nm:"接続ノード",br,x,y,kind:"small",cost:1,max:1,eff:{atkP:1,hpP:1}});link(prev,id);prev=id;}
    const nl=NOTABLES[br];let nCount=0;
    const notable=()=>{let def=nl[(nCount+bi)%nl.length];nCount++;if(U.notable&&U.notable[br]&&nCount===3)def=U.notable[br];return{nm:def[0],eff:scale(def[1]),unique:!!(U.notable&&U.notable[br]&&nCount===3)};};
    const trunk=[];
    for(let i=0;i<12;i++){const [x,y]=P(1+gap+i,0);const isN=i===5||i===9;
      const o=isN?{...notable(),kind:"notable",cost:2,max:1}:{nm:`${B.nm}強化`,eff:sm(i),kind:"small",cost:1,max:1};
      const id=add(`${cid}:${br}:t${i}`,{br,x,y,...o});link(prev,id);prev=id;trunk.push(id);}
    trunkAt[br]=trunk;
    [[2,1,2],[4,-1,2],[6,1,3],[8,-1,3],[10,1,3]].forEach(([ti,side,len],ci)=>{
      let p=trunk[ti];
      for(let j=0;j<len;j++){const [x,y]=P(1+gap+ti+j*0.2,side*(j+1));const id=add(`${cid}:${br}:c${ci}_${j}`,{br,x,y,nm:`${B.nm}強化`,eff:sm(j+1+ci),kind:"small",cost:1,max:1});link(p,id);p=id;}
      const [x,y]=P(1+gap+ti+len*0.2,side*(len+1));
      const id=add(`${cid}:${br}:n${ci}`,{br,x,y,...notable(),kind:"notable",cost:2+(ci%2),max:1});link(p,id);});
    const keys=KEYS[br].map(k=>k.slice());if(U[br])keys[0]=[U[br][0],U[br][1],"キャラ固有のキーストーン"];
    keys.forEach((k,ki)=>{const [x,y]=P(1+gap+12.8,ki?1.6:-1.6);
      const id=add(`${cid}:${br}:k${ki}`,{br,x,y,nm:k[0],eff:{...k[1]},desc:k[2],kind:"key",cost:U[br]&&ki===0?5:4,max:1,unique:!!(U[br]&&ki===0)});link(trunk[11],id);});
  });
  // ring paths between neighbouring branches: detours into far branches
  L.order.forEach((br,bi)=>{const nb=L.order[(bi+1)%6];
    for(const [ti,cnt,tag] of [[3,3,"a"],[8,4,"b"]]){
      const A=nodes[trunkAt[br][ti]],Bn=nodes[trunkAt[nb][ti]];let p=A.id;
      const ra=Math.hypot(A.x,A.y),rb=Math.hypot(Bn.x,Bn.y),aa=Math.atan2(A.y,A.x);let ab=Math.atan2(Bn.y,Bn.x);if(ab<aa)ab+=Math.PI*2;
      for(let j=1;j<=cnt;j++){const t=j/(cnt+1),r=ra+(rb-ra)*t,a=aa+(ab-aa)*t,own=j<=cnt/2?br:nb,Bx=BRANCH[own],[k,v]=Bx.s[j%2];
        const id=add(`${cid}:ring${tag}${bi}_${j}`,{br:own,x:Math.cos(a)*r,y:Math.sin(a)*r,nm:`${Bx.nm}連結`,eff:{[k]:v},kind:"small",cost:1,max:1});link(p,id);p=id;}
      link(p,Bn.id);}
  });
  for(const id in nodes)nodes[id].adj=[...adj[id]];
  return{nodes,root,count:Object.keys(nodes).length-1};
}

function effText(eff){const out=[];for(const k in eff){const v=eff[k];

// SP & allocation
const spEarned=cid=>Math.min(CFG.SP_CAP,(S.ch[cid].lv-1)*CFG.SP_PER_LV);
function spSpent(cid){const T=TREES[cid].nodes;let s=0;for(const id in S.ch[cid].nodes){if(T[id])s+=T[id].cost;}return s;}
const spFree=cid=>spEarned(cid)-spSpent(cid);
const isAlloc=(cid,id)=>id===TREES[cid].root||!!S.ch[cid].nodes[id];
function canAlloc(cid,id){const n=TREES[cid].nodes[id];return !!n&&!isAlloc(cid,id)&&n.adj.some(a=>isAlloc(cid,a));}
function alloc(cid,id){if(isAlloc(cid,id))return"取得済み";if(!canAlloc(cid,id))return"隣の前提ノードが未取得";const n=TREES[cid].nodes[id];if(spFree(cid)<n.cost)return"SPが足りない";S.ch[cid].nodes[id]=1;bumpStats();return null;}
function pathTo(cid,id){
  const T=TREES[cid].nodes;if(!T[id])return null;if(isAlloc(cid,id))return[];
  const starts=[TREES[cid].root,...Object.keys(S.ch[cid].nodes).filter(k=>T[k])],prev={},vis=new Set(starts),q=[...starts];
  while(q.length){const c=q.shift();for(const a of T[c].adj){if(vis.has(a))continue;vis.add(a);prev[a]=c;
    if(a===id){const p=[];let x=a;while(x&&!isAlloc(cid,x)){p.unshift(x);x=prev[x];}return p;}q.push(a);}}
  return null;}
const pathCost=(cid,p)=>p.reduce((a,id)=>a+TREES[cid].nodes[id].cost,0);
function allocPath(cid,id){const p=pathTo(cid,id);if(!p)return"たどり着けない";const c=pathCost(cid,p);if(c>spFree(cid))return`SPが足りない（必要${c}）`;for(const n of p)S.ch[cid].nodes[n]=1;bumpStats();return null;}
function connected(cid,nodes){const T=TREES[cid].nodes,keep=new Set([TREES[cid].root]),q=[TREES[cid].root];
  while(q.length){const x=q.shift();for(const a of T[x].adj)if(nodes[a]&&!keep.has(a)){keep.add(a);q.push(a);}}return keep;}
function dealloc(cid,id){const c=S.ch[cid];if(!c.nodes[id])return 0;delete c.nodes[id];const keep=connected(cid,c.nodes);let n=0;
  for(const k in c.nodes)if(!keep.has(k)){delete c.nodes[k];n++;}bumpStats();return n;}
function validateBuild(cid,nodes){const T=TREES[cid].nodes;let cost=0;for(const id in nodes){if(!T[id])return"今のツリーにないノードが含まれている";cost+=T[id].cost;}
  if(cost>spEarned(cid))return`SPが足りない（必要${cost} / いま獲得${spEarned(cid)}）`;
  const keep=connected(cid,nodes);for(const id in nodes)if(!keep.has(id))return"起点からつながっていないノードがある";return null;}

const LEGACY={atk:"atkP",spd:"aspd",multi:"extra",crit:"crit",drop:"drop",luck:"luck",foresee:"dodge",hp:"hpP",move:"move",guard:"def",regen:"regen",syncup:"syncM"};
function migrateLegacy(cid,sk){
  const T=TREES[cid].nodes;let placed=0;
  for(const old in sk){const stat=LEGACY[old];let n=Math.max(0,Math.floor(+sk[old]||0));if(!stat)continue;
    while(n-->0){let best=null,bp=null;for(const id in T){if(isAlloc(cid,id)||!(stat in T[id].eff))continue;const p=pathTo(cid,id);if(p&&(!bp||p.length<bp.length)){best=id;bp=p;}}
      if(!bp||pathCost(cid,bp)>spFree(cid))break;for(const x of bp)S.ch[cid].nodes[x]=1;placed++;}}
  return placed;}

// unified stat pipeline: base profile + level + gear (stats & specials) + tree nodes + temporary unit buffs
let STATV=0;const _cache={};
function bumpStats(){STATV++;}
function cached(key,fn){const c=_cache[key];if(c&&c.v===STATV)return c.d;const d=fn();_cache[key]={v:STATV,d};return d;}
const nodeSum=cid=>cached("n"+cid,()=>{const T=TREES[cid].nodes,s={},sp=new Set(),ail=new Set();
  for(const id in S.ch[cid].nodes){const n=T[id];if(!n)continue;for(const k in n.eff){const v=n.eff[k];if(k==="sp")sp.add(v);else if(k==="ail")ail.add(v);else s[k]=(s[k]||0)+v;}}return{s,sp,ail};});
const gearOf=cid=>cached("g"+cid,()=>{const g={atk:0,hp:0,crit:0,gain:0,sp:{}};
  for(const sl in S.ch[cid].eq){const it=itemById(S.ch[cid].eq[sl]);if(!it)continue;for(const k of["atk","hp","crit","gain"])g[k]+=ist(it,k);if(it.sp)g.sp[it.sp]=(g.sp[it.sp]||0)+1;}return g;});
const partyHas=cid=>MODE==="dive"&&[P,...ALLIES].some(u=>u&&u.cid===cid&&!u.down);
const bossParty=()=>MODE==="dive"&&ALLIES.length>0;
function fieldOn(cid){if(!nodeSum("ht").sp.has("field"))return false;return cid==="ht"||(bossParty()&&partyHas("ht"));}
function statsOf(cid,u){
  const c=S.ch[cid],b=CB[cid],N=nodeSum(cid),g=gearOf(cid),v=k=>N.s[k]||0,has=k=>N.sp.has(k),gs=k=>Math.min(2,g.sp[k]||0);
  let atkP=v("atkP"),aspd=v("aspd"),crit=b.crit+v("crit")+g.crit,critDmg=v("critDmg"),def=v("def"),stCh=b.stCh+v("stCh"),aoe=b.splash+v("aoe");
  let move=b.move*Math.max(0.4,1+v("move")/100);
  if(has("discard")){crit*=0.5;atkP+=45;aoe+=25;}
  if(has("release")){stCh*=0.4;crit+=25;atkP+=30;}
  if(has("echo")){def+=10+Math.max(0,move-1)*100*0.6;move*=0.85;}
  if(fieldOn(cid)){atkP+=15;def+=10;}
  if(bossParty()&&partyHas("ht"))atkP+=10;
  if(has("speedAtk")||gs("speedAtk"))atkP+=Math.min(40,Math.max(0,move-1)*100*(0.8+0.2*gs("speedAtk")));
  if(u){if(u.streak){atkP+=8*u.streak;aspd+=6*u.streak;}if(u.haste>0)aspd+=30;}
  const down=(typeof P!=="undefined"&&P&&P.cid===cid&&hasDb("atkdown"))?0.5:1;
  const atk=(3+c.lv*0.6+g.atk)*b.atk*Math.max(0.2,1+atkP/100)*down;
  const hp=(20+c.lv*4+g.hp)*b.hp*Math.max(0.3,1+v("hpP")/100);
  let range=RANGE*Math.min(2.2,Math.max(0.6,1+v("range")/100));if(u&&u.shield>0&&gs("barrierRange"))range*=1.2;
  return{atk,hp,crit:Math.max(0,Math.min(90,crit)),cdm:b.cdm+critDmg/100,cd:Math.max(0.12,0.38*b.cd/Math.max(0.3,1+aspd/100)),
    move:Math.max(0.5,move),def:Math.max(0,def),red:Math.min(0.75,Math.max(0,def)/(Math.max(0,def)+80)),dodge:Math.min(60,b.dodge+v("dodge")),counter:Math.min(100,v("counter")),
    barrier:hp*Math.min(80,v("barrier"))/100,regen:hp*v("regen")/100,range,aoe,extra:Math.min(4,Math.max(0,v("extra"))),pierce:b.pierce+v("pierce")+2*gs("pierceAll"),
    homing:v("homing")>0,multiT:Math.min(3,v("multiT")),followUp:Math.min(60,v("followUp")),stCh:Math.min(90,stCh),stPow:Math.max(0.3,1+v("stPow")/100),weak:v("weak")/100,
    pool:[...new Set([...b.pool,...N.ail])],drop:0.06*(1+v("drop")/100),luck:v("luck"),syncM:Math.max(0.3,1+v("syncM")/100),gain:1+g.gain/100,sp:N.sp,gsp:g.sp};
}
// live: the two members not exploring perform and earn; paused while they fight a boss
const liveChars=()=>CIDS.filter(c=>c!==S.char);
const livePaused=()=>MODE==="dive"&&ALLIES.length>0;
function perSec(){if(livePaused())return 0;const base=PRODUCERS.reduce((a,p)=>a+p.rate*(S.own[p.id]||0),0),lv=liveChars().reduce((a,c)=>a+S.ch[c].lv,0);return base*(1+0.04*lv)+lv*0.15;}
const xpNeed=lv=>Math.floor(10*Math.pow(1.28,lv-1));
function addMoney(x){S.n+=x;S.total+=Math.max(0,x);}
function addXp(cid,x){const c=S.ch[cid];c.xp+=x;let up=false;while(c.xp>=xpNeed(c.lv)){c.xp-=xpNeed(c.lv);c.lv++;up=true;}
  if(up){log(`${CHARS[cid].name} Lv${c.lv}${spEarned(cid)<CFG.SP_CAP||c.lv-1===CFG.SP_CAP?"（SP +1）":""}`);bumpStats();
    const u=[P,...ALLIES].find(u=>u&&u.cid===cid);if(u&&!u.down)u.hp=statsOf(cid,u).hp;markDirty();}}
// explorer 100%, live members 30% (100% when fighting the boss together), with catch-up for those far behind
function shareXp(x){
  addXp(S.char,x);const lv0=S.ch[S.char].lv,boss=bossParty();
  for(const c of liveChars()){const gap=lv0-S.ch[c].lv,cu=Math.min(CFG.CATCHUP_MAX,1+Math.max(0,gap-CFG.CATCHUP_GAP)*CFG.CATCHUP_STEP);addXp(c,x*(boss?1:CFG.LIVE_XP)*cu);}
}

/* ================= items ================= */
function rollRarity(boss,luck){
  const w={l:0.8*(1+0.35*luck),e:5*(1+0.2*luck),r:22*(1+0.08*luck),c:boss?0:72};
  let t=Object.values(w).reduce((a,b)=>a+b),r=Math.random()*t;
  for(const k of["l","e","r","c"]){if((r-=w[k])<0)return k;}return"c";
}
function makeItem(lvl,boss){
  const rar=rollRarity(boss,statsOf(S.char).luck),R=RAR[rar],slot=pick(["w","h","c"]),sd=SLOTS[slot];
  const base=sd.bases[Math.min(sd.bases.length-1,Math.floor(Math.random()*Math.min(sd.bases.length,1+lvl/5)))];
  const st={};
  if(slot==="w")st.atk=(2+lvl*0.9)*R.m*rnd(.85,1.15);
  if(slot==="h")st.hp=(6+lvl*2.5)*R.m*rnd(.85,1.15);
  if(slot==="c")st.gain=(5+lvl*1.2)*R.m*rnd(.85,1.15);
  const pool=["atk","hp","crit","gain"].filter(k=>!st[k]);
  for(let i=0;i<R.subs&&pool.length;i++){const k=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    st[k]=k==="atk"?(1+lvl*0.4)*R.m*rnd(.6,1):k==="hp"?(3+lvl)*R.m*rnd(.6,1):k==="crit"?(2+lvl*0.15)*R.m*rnd(.6,1):(2+lvl*0.5)*R.m*rnd(.6,1);}
  const sp=Math.random()<{l:1,e:0.5,r:0.2,c:0}[rar]?pick(Object.keys(GSP)):undefined;
  return{id:S.uid++,slot,rar,name:R.pre+base,lvl,plus:0,st,sp};
}
const sellValue=it=>Math.ceil(6*it.lvl*RAR[it.rar].m*RAR[it.rar].m*(1+it.plus*0.5));
const enhCost=it=>Math.ceil(25*it.lvl*Math.pow(1.7,it.plus)*RAR[it.rar].m);
function gainItem(it){
  if(S.inv.length>=INV_MAX){const v=sellValue(it);addMoney(v);log(`もちものがいっぱい：${it.name}を¥${fmt(v)}で売却`);return;}
  S.inv.push(it);log(`${RAR[it.rar].nm}「${it.name}」を手に入れた`);
  if(it.rar==="e"||it.rar==="l")toast(`${RAR[it.rar].nm}！「${it.name}」`);
  const c=S.ch[S.char];if(!c.eq[it.slot])c.eq[it.slot]=it.id;
  markDirty();
}
function addMat(k,f,n=1){const v=MATS[k].base*Math.pow(1.17,f-1)*n;const b=S.bag[k]||(S.bag[k]={n:0,v:0});b.n+=n;b.v+=v;}
const bagValue=()=>Object.values(S.bag).reduce((a,b)=>a+b.v,0)*statsOf(S.char).gain;
// materials brought home go into storage: keep them, deliver them for requests, or sell any amount
const stock=k=>S.mats[k]?S.mats[k].n:0;
const unitPrice=k=>S.mats[k]&&S.mats[k].n?S.mats[k].v/S.mats[k].n*statsOf(S.char).gain:MATS[k].base*statsOf(S.char).gain;
function stashBag(){let n=0;for(const k in S.bag){const b=S.bag[k],m=S.mats[k]||(S.mats[k]={n:0,v:0});m.n+=b.n;m.v+=b.v;n+=b.n;}S.bag={};return n;}
function takeMat(k,n){const m=S.mats[k];if(!m||m.n<n)return 0;const v=m.v/m.n*n;m.n-=n;m.v-=v;if(m.n<=0)delete S.mats[k];return v;}
function sellMat(k,n){n=Math.min(n,stock(k));if(n<=0)return 0;const money=takeMat(k,n)*statsOf(S.char).gain;addMoney(money);return money;}
const yogPrice=()=>Math.ceil(40*Math.pow(1.12,Math.min(S.best,60)-1));

function drawSyncFx(){

    ctx.strokeStyle="#ff4fa8";ctx.shadowColor="#ff4fa8";ctx.shadowBlur=8;ctx.lineWidth=2;
    for(const [nx,ny] of nodes){ctx.beginPath();ctx.moveTo(P.x,P.y-30);const k=Math.min(1,t/0.5);ctx.lineTo(P.x+(nx-P.x)*k,P.y-30+(ny-P.y+30)*k);ctx.stroke();}
    ctx.shadowBlur=0;
    ctx.font="20px DotGothic16, monospace";ctx.textAlign="center";ctx.fillStyle="#fff";
    ctx.fillText(t<0.45?"演算開始 ― ヨーデル・オン":"同期開始 ― シンク・オン",W/2,H/2-60);ctx.textAlign="left";
  }else{
    const k=(t-0.9)/0.8,r=k*520;
    for(let i=0;i<6;i++){ctx.strokeStyle=`hsla(${(i*60+t*400)%360},95%,62%,${1-k})`;ctx.lineWidth=10-i;ctx.beginPath();ctx.arc(P.x,P.y-30,Math.max(1,r-i*18),0,7);ctx.stroke();}

  }
}

/* ================= missions ================= */
function genMission(){
  const b=S.best,lf=Math.pow(1.17,Math.max(0,b-1));
  const sp=Object.keys(SPECIAL).filter(k=>b+2>=SPECIAL[k].minF);
  const types=["kill","kill","reach","collect","boss","deliver","deliver",...(sp.length?["special","special","special"]:[])];
  const t=pick(types),free=Math.random()<0.2;
  const m={id:S.mid++,type:t,prog:0,free,cl:free?pick(FREECLIENTS):pick(CLIENTS)};
  if(t==="kill"){m.need=10+Math.floor(Math.random()*4)*5+Math.floor(b/2)*2;m.txt=`ノイズを${m.need}体倒す`;m.rew=Math.ceil(m.need*6*lf);}
  if(t==="reach"){m.floor=b+1+Math.floor(Math.random()*2);m.need=1;m.txt=`第${m.floor}層まで到達する`;m.rew=Math.ceil(70*Math.pow(1.17,m.floor-1));}
  if(t==="collect"){m.need=2+Math.floor(Math.random()*3);m.txt=`歪み結晶を${m.need}個見つける`;m.rew=Math.ceil(m.need*70*lf);}
  if(t==="boss"){m.floor=Math.max(5,Math.ceil(b/5)*5);m.need=1;m.txt=`第${m.floor}層以降の巨大ノイズを倒す`;m.rew=Math.ceil(300*Math.pow(1.17,m.floor-1));m.bonus=true;}
  if(t==="special"){const k=pick(sp);m.et=k;m.minF=SPECIAL[k].minF;m.need=k==="mirror"?7:k==="hollow"?2:3;
    m.txt=`${SPECIAL[k].nm}を${m.need}体退治する`;m.sub=`第${m.minF}層以降に出る。受けている間だけ現れる。${SPECIAL[k].desc}`;
    m.rew=Math.ceil(m.need*45*Math.pow(1.17,Math.max(m.minF,b)-1));m.bonus=true;}
  if(t==="deliver"){const opts=[["shard",8+Math.floor(Math.random()*4)*4+Math.floor(b/2)*2,1.6]];if(b>=2)opts.push(["crystal",2+Math.floor(Math.random()*3),1.8]);
    if(b>=4)opts.push(["odd",2+Math.floor(Math.random()*2),1.8]);if(b>=8)opts.push(["core",1,2]);const [k,n,mul]=pick(opts);
    m.mat=k;m.need=n;m.txt=`${MATS[k].nm}を${n}個納品する`;m.sub="倉庫の素材を窓口で渡す。売るより高くつく。";m.rew=Math.ceil(MATS[k].base*Math.pow(1.17,Math.max(0,b-1))*n*mul);}
  if(free){m.rew=0;m.bonus=false;}
  return m;
}
function fillBoard(){while(S.board.length<3)S.board.push(genMission());}
function progress(type,e){
  for(const m of S.active){if(m.prog>=m.need)continue;let inc=0;
    if(type==="kill"&&m.type==="kill")inc=1;
    if(type==="special"&&m.type==="special"&&e.t===m.et)inc=1;
    if(type==="collect"&&m.type==="collect")inc=1;
    if(type==="boss"&&m.type==="boss"&&FLOOR>=m.floor)inc=1;
    if(type==="reach"&&m.type==="reach"&&FLOOR>=m.floor)inc=1;
    if(inc){m.prog=Math.min(m.need,m.prog+inc);if(m.prog>=m.need){toast(`依頼達成：${m.txt}。管理庁窓口で報告しよう`);}markDirty();}}
}
function claim(m){
  S.active=S.active.filter(x=>x!==m);
  const xp=Math.ceil(12*Math.pow(1.14,Math.max(0,S.best-1)))*(m.free?2:1);addXp(S.char,xp);
  if(m.free){if(S.yog<3)S.yog++;toast(`「ありがとう！」${m.cl}からヨーグルトをもらった（経験値 +${xp}）`);}
  else{addMoney(m.rew);let s=`報酬 ¥${fmt(m.rew)} を受け取った`;if(m.bonus){gainItem(makeItem(Math.max(1,S.best),true));s+="。ボーナスの装備も！";}toast(s);}
  markDirty();save(true);
}

function misCard(m,act){
  if(m.type==="deliver")m.prog=Math.min(m.need,stock(m.mat));

  const rw=m.free?`<span class="rw free">報酬なし<br><small>感謝の品</small></span>`:`<span class="rw">¥${fmt(m.rew)}${m.bonus?"<br><small>＋ボーナス装備</small>":""}</span>`;

    ${ed?'<p class="note">街にいる間は何度でも無料で振り直せます。</p>':'<p class="note">特殊空間にいる間は、ビルドの適用と振り直しはできません。</p>'}
    ${c.builds.map((b,i)=>{const ids=b.nodes?Object.keys(b.nodes):[],cost=ids.reduce((a,id)=>a+(T[id]?T[id].cost:0),0);
      return `<div class="bslot"><input data-bn="${i}" value="${esc(b.nm)}" maxlength="16" aria-label="ビルド${i+1}の名前"><button class="btn sm" data-b="save" data-i="${i}">保存</button><button class="btn sm" data-b="load" data-i="${i}" ${b.nodes&&ed?"":"disabled"}>適用</button>
        <div class="note" style="grid-column:1/-1">${b.nodes?`${ids.length}ノード・${cost}SP${cost>spEarned(cid)?`（SP不足：いま${spEarned(cid)}）`:""}`:"空き"}</div></div>`;}).join("")}`;
}
function renderStatSum(){
  const cid=VIEW,st=statsOf(cid);
  const rows=[["攻撃",fmt(st.atk)],["攻撃速度",(1/st.cd).toFixed(2)+"回/秒"],["射程",Math.round(st.range)],["会心率",st.crit.toFixed(0)+"%"],["会心ダメージ","×"+st.cdm.toFixed(2)],
    ["回避",st.dodge.toFixed(0)+"%"],["反撃率",st.counter.toFixed(0)+"%"],["最大HP",fmt(st.hp)],["防御（軽減）",Math.round(st.red*100)+"%"],["バリア",fmt(st.barrier)],["毎秒回復",st.regen.toFixed(1)],
    ["移動速度","×"+st.move.toFixed(2)],["弾数",1+st.extra],["貫通",st.pierce],["追加標的",st.multiT],["攻撃範囲",Math.round(st.aoe)],["状態異常付与",st.stCh.toFixed(0)+"%"],["追加攻撃率",st.followUp.toFixed(0)+"%"]];
  const sps=[...st.sp].map(k=>SPN[k]),gs=Object.keys(st.gsp).map(k=>GSP[k]);
  $("statsum").innerHTML=rows.map(([a,b])=>`<div><span class="note">${a}</span> <b>${b}</b></div>`).join("")+
    `<div style="grid-column:1/-1" class="note">付与する状態異常：${st.pool.map(k=>AILN[k]).join("・")||"なし"}</div>`+
    (sps.length||gs.length?`<div style="grid-column:1/-1" class="note" style="color:var(--gold)">特殊効果：${[...sps,...gs].map(esc).join(" / ")}</div>`:"");
}

/* ================= save ================= */
function save(silent){
  S.last=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));$("saved").textContent="最終保存 "+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"});if(!silent)toast("保存しました");}
  catch(e){$("saved").textContent="この環境では保存できません";if(!silent)toast("保存できませんでした（シークレットモードなど）");}
}
function sanCh(o,cid){const c=freshCh();if(!o||typeof o!=="object")return c;
  c.lv=Math.max(1,Math.floor(+o.lv||1));c.xp=Math.max(0,+o.xp||0);
  for(const k in c.eq)c.eq[k]=(o.eq||{})[k]??null;
  const T=TREES[cid].nodes;if(o.nodes&&typeof o.nodes==="object")for(const id in o.nodes)if(T[id])c.nodes[id]=1;
  if(Array.isArray(o.builds))o.builds.slice(0,5).forEach((b,i)=>{if(!b)return;c.builds[i].nm=String(b.nm||c.builds[i].nm).slice(0,16);
    if(b.nodes&&typeof b.nodes==="object"){const n={};for(const id in b.nodes)if(T[id])n[id]=1;c.builds[i].nodes=n;}});
  if(o.sk&&!o.nodes)c._legacy=o.sk;
  return c;}
// after loading: keep only connected nodes within the SP budget, and place old skill points onto equivalent nodes
let LEGACY_NOTE="";
function finishLoad(){LEGACY_NOTE="";
  for(const cid of CIDS){const c=S.ch[cid];const keep=connected(cid,c.nodes);for(const k in c.nodes)if(!keep.has(k))delete c.nodes[k];
    if(spSpent(cid)>spEarned(cid))c.nodes={};
    if(c._legacy){const n=migrateLegacy(cid,c._legacy);delete c._legacy;if(n)LEGACY_NOTE+=`${CHARS[cid].name}の旧スキル${n}件を新しいツリーに移しました。`;}}
  S.ver=2;bumpStats();if(LEGACY_NOTE)setTimeout(()=>toast(LEGACY_NOTE),1500);}
const MISTYPES=["kill","reach","collect","boss","special","deliver"];
function sanMis(m){if(!m||!MISTYPES.includes(m.type))return null;return{id:+m.id||0,type:m.type,prog:Math.max(0,+m.prog||0),need:Math.max(1,+m.need||1),free:!!m.free,cl:String(m.cl||"").slice(0,20),
  txt:String(m.txt||"").slice(0,60),sub:m.sub?String(m.sub).slice(0,80):undefined,rew:Math.max(0,+m.rew||0),bonus:!!m.bonus,floor:+m.floor||0,minF:+m.minF||0,et:SPECIAL[m.et]?m.et:undefined,mat:MATS[m.mat]?m.mat:undefined};}
function sanitize(o){
  const s=fresh();if(!o||typeof o!=="object")return s;
  s.n=Math.max(0,+o.n||0);s.total=Math.max(0,+o.total||0);s.best=Math.max(1,Math.floor(+o.best||1));s.uid=Math.max(1,Math.floor(+o.uid||1));s.mid=Math.max(1,Math.floor(+o.mid||1));
  s.last=+o.last||Date.now();s.char=CIDS.includes(o.char)?o.char:"luarie";s.yog=Math.min(3,Math.max(0,Math.floor(+o.yog||0)));s.intro=!!o.intro;
  for(const p of PRODUCERS)s.own[p.id]=Math.max(0,Math.floor(+(o.own||{})[p.id]||0));
  if(Array.isArray(o.inv))s.inv=o.inv.filter(i=>i&&SLOTS[i.slot]&&RAR[i.rar]&&i.st).slice(0,INV_MAX).map(i=>({id:+i.id,slot:i.slot,rar:i.rar,name:String(i.name).slice(0,30),sp:GSP[i.sp]?i.sp:undefined,lvl:Math.max(1,+i.lvl||1),plus:Math.min(10,Math.max(0,+i.plus||0)),st:Object.fromEntries(Object.entries(i.st).filter(([k])=>STN[k]).map(([k,v])=>[k,+v||0]))}));
  if(o.ch){for(const c of CIDS)s.ch[c]=sanCh(o.ch[c],c);}
  else{ // old single-character save: carry level & gear over, refund skill points (the tree changed)
    const c=sanCh({lv:o.lv,xp:o.xp,eq:o.eq,sk:o.sk||{}},s.char);s.ch[s.char]=c;}
  const ids=new Set(s.inv.map(i=>i.id)),used=new Set();
  for(const c of CIDS)for(const k in s.ch[c].eq){const id=s.ch[c].eq[k];const it=s.inv.find(i=>i.id===id);s.ch[c].eq[k]=(it&&it.slot===k&&!used.has(id))?id:null;if(s.ch[c].eq[k])used.add(id);}
  for(const k in MATS){const b=(o.bag||{})[k];if(b&&+b.n>0)s.bag[k]={n:Math.floor(+b.n),v:Math.max(0,+b.v||0)};const m=(o.mats||{})[k];if(m&&+m.n>0)s.mats[k]={n:Math.floor(+m.n),v:Math.max(0,+m.v||0)};}
  s.board=(o.board||[]).map(sanMis).filter(Boolean).slice(0,3);s.active=(o.active||[]).map(sanMis).filter(Boolean).slice(0,2);
  s.uid=Math.max(s.uid,...s.inv.map(i=>i.id+1),1);s.mid=Math.max(s.mid,...[...s.board,...s.active].map(m=>m.id+1),1);
  return s;
}
function applyOffline(){
  const sec=Math.min((Date.now()-S.last)/1000,12*3600),gain=perSec()*sec;
  if(sec>30&&gain>=1){addMoney(gain);toast(`留守のあいだにライブのお礼 ¥${fmt(gain)} が届いた`);}
}
function load(){try{let raw=localStorage.getItem(KEY);if(!raw)raw=localStorage.getItem(OLDKEY);if(raw){S=sanitize(JSON.parse(raw));finishLoad();applyOffline();return true;}}catch(e){}return false;}
const encode=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const decode=t=>JSON.parse(decodeURIComponent(escape(atob(t.trim()))));

/* ================= wiring ================= */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  for(const t of["main","skill","gear","save"])$("p-"+t).hidden=t!==tab;if(tab!=="main")VIEW=VIEW||S.char;markDirty();});
$("p-main").addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("selectstart",e=>{if(e.target.tagName!=="TEXTAREA")e.preventDefault();});
$("bSync").onclick=triggerSync;$("bYog").onclick=useYogurt;
const hideBoxes=()=>["exportBox","importBox","resetBox"].forEach(i=>$(i).hidden=true);
$("bSave").onclick=()=>save(false);
$("bExport").onclick=()=>{hideBoxes();S.last=Date.now();$("exportText").value=encode(S);$("exportBox").hidden=false;};
$("bCopy").onclick=()=>{const t=$("exportText");const fb=()=>{t.select();toast("選択しました。長押しでコピーしてください");};
  try{navigator.clipboard.writeText(t.value).then(()=>toast("コピーしました"),fb);}catch(e){fb();}};
$("bImport").onclick=()=>{hideBoxes();$("importBox").hidden=false;};
$("bDoImport").onclick=()=>{try{S=sanitize(decode($("importText").value));finishLoad();applyOffline();save(true);VIEW=S.char;enterTown(false);hideBoxes();$("importText").value="";toast("復元しました");}
  catch(e){toast("コードが読み取れません。全部コピーできているか確認してください");}};
$("bReset").onclick=()=>{hideBoxes();$("resetBox").hidden=false;};
$("bCancelReset").onclick=hideBoxes;
$("bDoReset").onclick=()=>{S=fresh();fillBoard();save(true);VIEW=S.char;OPEN=null;enterTown(false);hideBoxes();toast("はじめからになりました");};

/* ================= loop ================= */
function start(data){
  if(data&&data.S){S=sanitize(data.S);finishLoad();}else load();
  fillBoard();VIEW=S.char;tvSetup();enterTown(false);
  if(!S.intro){S.intro=true;toast("3-Sync、今月もガス代がピンチ。歪みゲートで稼ごう");}
  renderPanels();
  let prev=performance.now(),hudT=0;
  (function tick(now){
    const dt=Math.min((now-prev)/1000,0.05);prev=now;
    addMoney(perSec()*dt);
    if(tab==="main"&&!document.hidden){if(MODE==="town"){updateTown(dt);drawTown();}else{updateDive(dt);drawDive();}}
    if(tab==="skill"&&!document.hidden){if(TV.cid!==VIEW){if(tvFit())TV.cid=VIEW;}tvDraw();}
    hudT+=dt;if(hudT>0.15){hudT=0;if(dirty)renderPanels();else renderHud();}
    requestAnimationFrame(tick);
  })(prev);
  setInterval(()=>save(true),10000);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)save(true);});
  addEventListener("pagehide",()=>save(true));
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
