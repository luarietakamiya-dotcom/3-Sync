    if(ART_ON&&ART_ON.zone==="front")for(const h of HAZ){const r=h.type==="rift"?80:h.radius||40;if(x1>h.x-r&&x0<h.x+r&&y1>h.y-r*.5&&y0<h.y+r*.5){hid=true;d.al=.35;}}
    d.al=hid?Math.max(0.35,d.al-0.65/0.12*dt):Math.min(1,d.al+0.65/0.2*dt);}}
// bounding boxes of attack telegraphs: floor lights under them drop to 25%
function teleBoxes(){const b=[];for(const e of EN){if(e.wind>0&&e.ca!==undefined){const x2=e.x+Math.cos(e.ca)*170,y2=e.y+Math.sin(e.ca)*170,r=e.r;b.push([Math.min(e.x,x2)-r,Math.min(e.y,y2)-r,Math.max(e.x,x2)+r,Math.max(e.y,y2)+r]);}
    if(e.fuse>0){const R=(e.p&&e.p.radius)||48;b.push([e.x-R,e.y-R*0.7,e.x+R,e.y+R*0.7]);}}
  for(const h of HAZ)if(h.type==="falling")for(const m of h.marks){const R=h.radius||30;b.push([m.x-R,m.y-R*0.5,m.x+R,m.y+R*0.5]);}
  return b;}
const teleK=(tb,x0,y0,x1,y1)=>{for(const b of tb)if(x1>b[0]&&x0<b[2]&&y1>b[1]&&y0<b[3])return 0.25;return 1;};
// paving: 96×48 panels, rows offset by 48, some split into 48×48; only the visible part, batched by colour
function drawArtFloor(A,vx0,vy0,vw,vh,seed,tb){if(A.zone==="front")return drawFrontFloor(A,vx0,vy0,vw,vh,seed,tb);const F=A.floor,PW=96,PH=48,TOP=62;
  const fx0=Math.max(0,vx0),fy0=Math.max(TOP,vy0),fx1=Math.min(WW,vx0+vw),fy1=Math.min(WH,vy0+vh);if(fx1<=fx0||fy1<=fy0)return;
  ctx.fillStyle=F.panel[0];ctx.fillRect(fx0,fy0,fx1-fx0,fy1-fy0); // the common panel shade is the backdrop; only the other shade is filled per panel
  const r0=Math.max(0,Math.floor((vy0-TOP)/PH)),r1=Math.floor((Math.min(WH,vy0+vh)-TOP)/PH),pa=[[],[]],seams=[],steps=[],hl=[],plates=[],glows=[];
  for(let r=r0;r<=r1;r++){const off=(r&1)?48:0,py=TOP+r*PH,c0=Math.floor((Math.max(0,vx0)+off)/PW),c1=Math.floor((Math.min(WW,vx0+vw)+off)/PW);
    for(let c=c0;c<=c1;c++){const px=c*PW-off,h=hh(c,r,seed);
      if(h<0.11){pa[0].push([px,py,48,PH]);pa[1].push([px+48,py,48,PH]);seams.push([px+48,py,1,PH]);plates.push([px+48+10+Math.floor(hh(c,r,seed+3)*14),py+14,14,10]);}
      else pa[h<0.55?0:1].push([px,py,PW,PH]);
      seams.push([px,py,1,PH],[px,py,PW,1]);steps.push([px+1,py+1,PW-1,1]);hl.push([px+2,py+2,10+Math.floor(hh(r,c,seed)*12),1]);
      if(hh(c,r,seed+7)<0.045){const L=24+Math.floor(hh(c,r,seed+8)*25),gx=px+4+Math.floor(hh(c,r,seed+9)*(PW-8-L));glows.push([gx,py,L]);}}}
  ctx.fillStyle=F.panel[1];for(const p of pa[1])ctx.fillRect(p[0]+1,p[1]+1,p[2]-1,p[3]-1); // fillRect is the fast path (no path rasterising)
  ctx.fillStyle=F.base;for(const s of seams)ctx.fillRect(s[0],s[1],s[2],s[3]); // 1px joint gap in the base colour
  ctx.fillStyle="#0E151E";for(const s of steps)ctx.fillRect(s[0],s[1],s[2],s[3]); // step under each joint
  ctx.fillStyle="#1A2430";for(const s of hl)ctx.fillRect(s[0],s[1],s[2],s[3]); // thin edge highlight
  ctx.fillStyle="#111A24";ctx.beginPath();for(const p of plates)ctx.rect(p[0],p[1]+p[3],p[2],1);ctx.fill(); // service plates on the split panels: flush cover, lit top edge, two bolts
  ctx.fillStyle="#152029";ctx.beginPath();for(const p of plates)ctx.rect(p[0],p[1],p[2],p[3]);ctx.fill();
  ctx.fillStyle="#1A2430";ctx.beginPath();for(const p of plates){ctx.rect(p[0],p[1],p[2],1);ctx.rect(p[0]+2,p[1]+3,1,1);ctx.rect(p[0]+p[2]-3,p[1]+p[3]-3,1,1);}ctx.fill();
  ctx.globalAlpha=F.seamA;ctx.fillStyle=F.seam;for(const s of seams)ctx.fillRect(s[0],s[1],s[2],s[3]);ctx.globalAlpha=1; // same joints, seam colour at ≤0.3
  // drain slits: one per base-screen cell, kept in the middle half so any screen holds at most 4
  const cx0=Math.floor(vx0/W),cx1=Math.floor((vx0+vw)/W),cy0=Math.floor(vy0/H),cy1=Math.floor((vy0+vh)/H);ctx.fillStyle="#0A1017";ctx.beginPath();const bars=[];
  for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){const sx=Math.round(cx*W+W/4+hh(cx,cy,seed+11)*W/2),sy=Math.round(cy*H+H/4+hh(cx,cy,seed+12)*H/2);if(sy<90||sy>WH-20||sx<20||sx>WW-40)continue;
    ctx.rect(sx,sy,18,4);for(let i=0;i<4;i++)bars.push([sx+3+i*4,sy+1]);}
  ctx.fill();ctx.fillStyle="#18232F";ctx.beginPath();for(const b of bars)ctx.rect(b[0],b[1],1,2);ctx.fill();
  for(const g of glows){const near=Math.hypot(g[0]+g[2]/2-P.x,g[1]-P.y)<48?0.5:1;ctx.fillStyle=`rgba(${F.glow},${F.glowA*near*teleK(tb,g[0],g[1]-2,g[0]+g[2],g[1]+2)})`;ctx.fillRect(g[0],g[1],g[2],1);}} // a few lit joints (≤5%)
// ground layer: lamp pools, reflections, low fog, back rain, splashes (before hazards and telegraphs)
const RAIN2=(()=>{const r=srand(23);return Array.from({length:96},(_,i)=>({x:r()*W,y:r()*H,l:6+r()*8,s:180+r()*120,a:i<72?(r()<0.5?0:1):0}));})();
function drawArtRain(A,front,vx0,vy0,vw,vh){const n=A.rain.back;
  const draw=(i0,i1,pred,col)=>{ctx.strokeStyle=col;ctx.beginPath();for(let i=i0;i<i1;i++){const r=RAIN2[i];if(!pred(r))continue;const y=(r.y+G.t*r.s)%H,x=(r.x+y*0.18)%W,X=vx0+x/W*vw,Y=vy0+y/H*vh;ctx.moveTo(X,Y);ctx.lineTo(X+r.l*0.18,Y+r.l);}ctx.stroke();};
  if(front)draw(n,n+A.rain.front,()=>true,"rgba(176,194,212,.075)");
  else{draw(0,n,r=>r.a===0,"rgba(176,194,212,.11)");draw(0,n,r=>r.a===1,"rgba(176,194,212,.15)");}}
function drawArtGround(A,ds,vx0,vy0,vw,vh,seed,tb){if(A.zone==="front")return drawFrontGround(A,ds,vx0,vy0,vw,vh,seed,tb);const t=G.t;
  // lamp light pools on the floor
  for(const d of ds)if(d.kind==="slum_lamp"){const k=teleK(tb,d.x-34,d.y-6,d.x+34,d.y+12);ctx.fillStyle=`rgba(101,200,208,${0.045*k})`;ctx.beginPath();ctx.ellipse(d.x,d.y+3,34,9,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(d.x,d.y+3,18,5,0,0,7);ctx.fill();}
  // short reflection bands under lit objects, fixed to the light (max 4, nearest the view centre)
  const cx=vx0+vw/2,cy=vy0+vh/2,L=ds.filter(d=>d.light).sort((a,b)=>Math.hypot(a.x-cx,a.y-cy)-Math.hypot(b.x-cx,b.y-cy)).slice(0,A.refl);
  for(const d of L){const per=2.8+d.s*1.7,ph=Math.sin((t+d.ph)*6.283/per),nb=2+(d.v%2),wv=d.lw*(1+0.1*ph),k=teleK(tb,d.x-wv/2,d.y+3,d.x+wv/2,d.y+17);
    for(let i=0;i<nb;i++){const a=(0.1-i*0.025)*(1+0.2*ph)*k,w=wv*(1-i*0.22);ctx.fillStyle=`rgba(${d.light},${a})`;ctx.fillRect(Math.round(d.x-w/2+(i%2?2:-1)),Math.round(d.y+4+i*5),Math.round(w),1);}}
  // low fog (max 2 sheets in view)
  const ns=Math.max(2,Math.round(WW*WH/(W*H)*1.2));let shown=0;
  for(let i=0;i<ns&&shown<A.fog;i++){const w=120+hh(i,1,seed)*80,h=20+hh(i,2,seed)*12,sp=3+hh(i,3,seed)*3,fy=100+hh(i,4,seed)*(WH-140),fx=((hh(i,5,seed)*(WW+w)+t*sp)%(WW+w))-w;
    if(fx+w<vx0||fx>vx0+vw||fy+h<vy0||fy-h>vy0+vh)continue;shown++;const a=0.025+hh(i,6,seed)*0.02;
    ctx.save();ctx.translate(fx+w/2,fy);ctx.scale(1,h/w);const g=ctx.createRadialGradient(0,0,0,0,0,w/2);g.addColorStop(0,`rgba(150,175,195,${a})`);g.addColorStop(1,"rgba(150,175,195,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,w/2,0,7);ctx.fill();ctx.restore();}
  drawArtRain(A,false,vx0,vy0,vw,vh);
  // splashes: fixed landing cells, timed (max 12 in view)
  const CW=160,CH=120,i0=Math.floor(vx0/CW),i1=Math.floor((vx0+vw)/CW),j0=Math.floor(vy0/CH),j1=Math.floor((vy0+vh)/CH);let sn=0;ctx.strokeStyle="rgba(176,194,212,.22)";ctx.beginPath();
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){if(sn>=A.rain.splash)break;const per=0.9+hh(i,j,seed+20)*0.8,life=0.22+hh(i,j,seed+21)*0.13,tt=t+hh(i,j,seed+22)*per,cyc=Math.floor(tt/per),age=tt-cyc*per;if(age>=life)continue;
    const sx=i*CW+hh(i,j,cyc)*CW,sy=j*CH+hh(j,i,cyc+1)*CH;if(sy<70||sy>WH-4||sx<4||sx>WW-4)continue;sn++;const k=age/life,w=2+k*3,u=1.5+k*1.5;
    ctx.moveTo(sx-1,sy);ctx.lineTo(sx-w,sy-u);ctx.moveTo(sx+1,sy);ctx.lineTo(sx+w,sy-u);}
  ctx.stroke();}
// skyline window groups breathe between 70% and 100% (never off)
function artSky(A){const k=[];for(let g=0;g<A.skyLights;g++){const per=4+hh(g,9,1)*5;k.push(0.85+0.15*Math.sin(G.t*6.283/per+g*1.7));}return k;}
// hazard: puddle in map-art zones — the yellow-green rim IS the hit ellipse (rx = r, ry = 0.45r, same as updateHazards)
function drawArtPuddle(h,idx,ds){const t=G.t,R=h.radius||26,ry=R*0.45,x=h.x,y=h.y;
  let lit=0.4;for(const d of ds)if(d.light&&Math.hypot(d.x-x,d.y-y)<120){lit=1;break;}
  ctx.fillStyle="rgba(6,14,22,.22)";ctx.beginPath();ctx.ellipse(x,y,R,ry,0,0,7);ctx.fill();
  ctx.fillStyle="rgba(101,200,208,.07)";ctx.beginPath();ctx.ellipse(x+1,y+0.5,R*0.8,ry*0.72,0,0,7);ctx.fill();
  ctx.strokeStyle=`rgba(170,230,235,${0.3*lit+0.1})`;ctx.beginPath();ctx.ellipse(x,y,R-2.5,ry-1.5,0,Math.PI*1.1,Math.PI*1.45);ctx.stroke(); // thin rim reflection
  for(let j=0;j<2;j++){const per=1.5+j*0.45,tt=t+j*0.8+idx*0.37,cyc=Math.floor(tt/per),age=tt-cyc*per;if(age>=0.7)continue; // ripples (≤2, 0.7s, stay inside)
    const k=age/0.7,a=hh(idx,j,cyc)*6.283,cr=hh(j,idx,cyc)*0.4,mx=0.9-cr,rr=0.12+k*(mx-0.12);
    ctx.strokeStyle=`rgba(180,232,236,${0.4*(1-k)})`;ctx.beginPath();ctx.ellipse(x+Math.cos(a)*cr*R,y+Math.sin(a)*cr*ry,rr*R,rr*ry,0,0,7);ctx.stroke();}
  for(let j=0;j<2;j++){const sw=Math.sin(t*0.9+j*2+idx)*1.5;ctx.fillStyle=`rgba(190,236,240,${(0.22-j*0.06)*lit})`;ctx.fillRect(Math.round(x-R*0.42+j*R*0.3+sw),Math.round(y-ry*0.35+j*ry*0.45),Math.round(R*(0.42-j*0.12)),1);} // drifting reflections
  ctx.strokeStyle="rgba(182,232,140,.6)";ctx.beginPath();ctx.ellipse(x,y,R,ry,0,0,7);ctx.stroke(); // danger rim = hit test
  const ba=0.575+0.125*Math.sin(t*3.491+idx);ctx.strokeStyle=`rgba(182,232,140,${ba})`;ctx.lineWidth=2;ctx.beginPath();
  for(let q=0;q<4;q++){const a0=0.35+q*Math.PI/2;ctx.moveTo(x+Math.cos(a0)*R,y+Math.sin(a0)*ry);ctx.ellipse(x,y,R,ry,0,a0,a0+0.32);}ctx.stroke();ctx.lineWidth=1;}

let zoom=1,last=0;document.getElementById('zoom').onclick=()=>zoom=zoom===1?2:1;
function frame(ms){const dt=last?(ms-last)/1000:0;last=ms;if(!document.getElementById('pause').checked)G.t+=dt;
HAZ=document.getElementById('haz').checked?[{type:'rift',x:400,y:145,t:1,cd:3.2},{type:'noise',x:660,y:235,radius:55}]:[];
ctx.canvas.style.filter=document.getElementById('gray').checked?'grayscale(1)':'';ctx.clearRect(0,0,640,360);ctx.save();ctx.scale(zoom,zoom);ctx.translate(-180,-100);drawFrontFloor(BG_ART.front,180,100,640/zoom,360/zoom,5,[]);HAZ.forEach(drawFrontHazard);ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
